name: create release

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
        description: The branch to release
      version:
        required: true
        type: string
        description: The version of the release
      body:
        required: true
        type: string
        description: The body of the release
      prerelease:
        required: false
        default: false
        type: boolean
        description: Whether the release is a prerelease

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # release-action's `commit` expects a branch name or SHA, not a fully
      # qualified ref. Strip a leading refs/heads/ so callers may pass either.
      - id: normalize
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: echo "commit=${INPUT_BRANCH#refs/heads/}" >> "$GITHUB_OUTPUT"

      - uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          name: ${{ inputs.version }}
          tag: ${{ inputs.version }}
          body: ${{ inputs.body }}
          commit: ${{ steps.normalize.outputs.commit }}
          prerelease: ${{ inputs.prerelease == 'prereleased' }}
