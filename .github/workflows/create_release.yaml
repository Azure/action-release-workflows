name: create release

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
        description: The branch to release
      version:
        required: true
        type: string
        description: The version of the release
      body:
        required: true
        type: string
        description: The body of the release
      prerelease:
        required: false
        default: false
        type: boolean
        description: Whether the release is a prerelease
      expectedCommit:
        required: false
        default: ""
        type: string
        description: When set, require the branch to still point to this full commit and tag this commit

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # release-action's `commit` expects a branch name or SHA, not a fully
      # qualified ref. Strip a leading refs/heads/ so callers may pass either.
      - id: normalize
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          EXPECTED_COMMIT: ${{ inputs.expectedCommit }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch=${INPUT_BRANCH#refs/heads/}
          commit=$branch
          if [[ -n "$EXPECTED_COMMIT" ]]; then
            [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a full commit SHA" >&2; exit 1; }
            actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
            [[ "$actual" = "$EXPECTED_COMMIT" ]] || { echo "Release branch no longer matches the tested commit" >&2; exit 1; }
            git push origin "$EXPECTED_COMMIT:refs/tags/$RELEASE_VERSION"
            commit=$EXPECTED_COMMIT
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b # v1.20.0
        with:
          name: ${{ inputs.version }}
          tag: ${{ inputs.version }}
          body: ${{ inputs.body }}
          commit: ${{ steps.normalize.outputs.commit }}
          prerelease: ${{ inputs.prerelease == 'prereleased' }}
