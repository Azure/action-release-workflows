name: Test release gate

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -B -m unittest discover -s tests -v
