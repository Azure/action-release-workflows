name: create branch

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: The version of the release

jobs:
  branch:
    runs-on: ubuntu-latest
    env:
      BRANCH: releases/${{ inputs.version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup git config
        run: |
          git config user.name "GitHub Action"
          git config user.email "github-action@users.noreply.github.com"

      # Node 24 matches the `using: node24` runtime the released actions declare,
      # and ships npm >= 11.10.0. Without this the job runs on the runner default
      # (node 22 / npm 10.x), which fails `npm install` for callers that set
      # engine-strict=true alongside an "npm": ">=11.10.0" engines constraint.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: guarantee branch doesn't exist
        run: |
          if git ls-remote --exit-code --heads origin ${BRANCH} ; then 
            exit 1
          else
            exit 0
          fi

      - name: install dependencies
        run: |
          npm install

      - name: build
        run: npm run build

      - name: create branch
        run: |
          git checkout -b ${BRANCH}
          sed -i '/lib/d' ./.gitignore
          git add .
          git commit -m "build"
          git push origin ${BRANCH}
